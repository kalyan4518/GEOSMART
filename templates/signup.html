{% extends "base.html" %}
{% block title %}Sign Up – GEOSMART{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-background via-background to-primary/20 p-4">
  <div class="w-full max-w-md animate-fade-in">
    <div class="text-center mb-8">
      <div class="flex items-center justify-center mb-4">
        <i data-lucide="leaf" class="w-12 h-12 text-primary animate-glow-pulse"></i>
      </div>
      <h1 class="text-4xl font-bold mb-2 bg-gradient-to-r from-primary to-orange-400 bg-clip-text text-transparent">
        ♻️ GEOSMART
      </h1>
      <p class="text-muted-foreground">Join the Green Movement</p>
    </div>

    <div class="bg-card/50 backdrop-blur-sm border border-primary/20 rounded-2xl p-8" style="box-shadow: 0 0 40px hsl(24 100% 50% / 0.1);">
      <h2 class="text-2xl font-semibold mb-6">Create Account</h2>

      <form method="POST" action="{{ url_for('signup') }}" id="signupForm" class="space-y-4">
        <div>
          <label class="label" for="name">Name</label>
          <input class="input mt-1" id="name" name="name" placeholder="Your full name" required />
        </div>

        <div>
          <label class="label" for="email">Email ID</label>
          <input class="input mt-1" id="email" name="email" type="email" placeholder="your@email.com" required />
        </div>

        <div>
          <label class="label" for="password">Password</label>
          <input class="input mt-1" id="password" name="password" type="password" placeholder="••••••••" required />
        </div>

        <div>
          <label class="label" for="confirmPassword">Confirm Password</label>
          <input class="input mt-1" id="confirmPassword" name="confirmPassword" type="password" placeholder="••••••••" required />
        </div>

        <div>
          <label class="label" for="location">Location (City/Town)</label>
          <input class="input mt-1" id="location" name="location" placeholder="Your city" required />
        </div>

        <div>
          <label class="label" for="state">State</label>
          <input class="input mt-1" id="state" name="state" placeholder="Your state" required />
        </div>

        <button type="submit"
          class="btn btn-default w-full transition-all duration-300 hover:scale-[1.02]"
          style="box-shadow: 0 0 0 0 transparent;"
          onmouseover="this.style.boxShadow='0 0 20px hsl(24 100% 50% / 0.5)'"
          onmouseout="this.style.boxShadow='0 0 0 0 transparent'">
          Create Account
        </button>
      </form>

      <p class="text-center text-sm text-muted-foreground mt-6">
        Already have an account?
        <a href="{{ url_for('login') }}" class="text-primary hover:underline font-medium">Login here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('signupForm').addEventListener('submit', function(e) {
    var pw = document.getElementById('password').value;
    var cpw = document.getElementById('confirmPassword').value;
    if (pw !== cpw) {
      e.preventDefault();
      showToast('Error', "Passwords don't match!");
    }
  });
</script>
{% endblock %}
